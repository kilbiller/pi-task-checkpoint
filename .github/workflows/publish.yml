name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const { version } = JSON.parse(fs.readFileSync("package.json"));
            if (process.env.RELEASE_TAG !== `v${version}`) {
              throw new Error("Release tag must match package.json version");
            }
          '

      - run: npm ci --ignore-scripts
      - run: npm run check

      - name: Publish package
        run: npm publish --access public
        env:
          NPM_CONFIG_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
